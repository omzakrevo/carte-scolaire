<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B44B8"/>
      <stop offset=".55" stop-color="#1B2A6B"/>
      <stop offset="1" stop-color="#0E1640"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".2" r=".6">
      <stop offset="0" stop-color="#6F8CFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6F8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE15A"/>
      <stop offset="1" stop-color="#F2B705"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="160" y="350" width="704" height="450" rx="56"/></clipPath>
    <clipPath id="photo"><rect x="214" y="470" width="196" height="250" rx="26"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#050a24" flood-opacity=".45"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#050a24" flood-opacity=".45"/></filter>
  </defs>
  <g id="BG">
    <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
    <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>
  </g>
  <g id="FG">
    <g transform="rotate(-6 512 575)">
      <g filter="url(#sh)">
        <rect x="160" y="350" width="704" height="450" rx="56" fill="#FFFFFF"/>
      </g>
      <g clip-path="url(#cardclip)">
        <rect x="160" y="350" width="704" height="96" fill="#E31E24"/>
        <path d="M160 800 L160 744 C 360 744 600 690 864 600 L864 800 Z" fill="#E31E24"/>
        <path d="M160 744 C 360 744 600 690 864 600" fill="none" stroke="#FCD116" stroke-width="16"/>
      </g>
      <!-- photo -->
      <rect x="214" y="470" width="196" height="250" rx="26" fill="#D9EEF9"/>
      <g clip-path="url(#photo)">
        <circle cx="312" cy="566" r="50" fill="#1B2A6B"/>
        <path d="M222 726 C 226 656 266 628 312 628 C 358 628 398 656 402 726 Z" fill="#1B2A6B"/>
      </g>
      <!-- lignes d'information -->
      <rect x="452" y="482" width="320" height="34" rx="17" fill="#1B2A6B"/>
      <rect x="452" y="546" width="250" height="24" rx="12" fill="#9AA6CF"/>
      <rect x="452" y="594" width="290" height="24" rx="12" fill="#9AA6CF"/>
      <rect x="452" y="642" width="190" height="24" rx="12" fill="#9AA6CF"/>
      <!-- texte de l'en-tête -->
      <rect x="230" y="384" width="300" height="28" rx="14" fill="#FFFFFF" opacity=".9"/>
    </g>
    <!-- toque de diplômé -->
    <g filter="url(#sh2)" transform="translate(640 190) rotate(10)">
      <path d="M-40 70 L-40 150 C 20 190 140 190 200 150 L200 70 Z" fill="#E6A800"/>
      <path d="M80 0 L270 80 L80 160 L-110 80 Z" fill="url(#cap)"/>
      <path d="M80 80 L230 120 L230 215" fill="none" stroke="#E31E24" stroke-width="14" stroke-linecap="round"/>
      <circle cx="230" cy="228" r="20" fill="#E31E24"/>
      <circle cx="80" cy="80" r="16" fill="#E31E24"/>
    </g>
  </g>
</svg>
