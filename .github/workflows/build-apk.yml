name: Compilation Android et Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'licenses/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Tests
        run: flutter test
      - name: Compilation de l'APK
        run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk carte-scolaire.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: carte-scolaire.apk

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Compilation Windows
        run: flutter build windows --release
      - name: Version portable (ZIP)
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath carte-scolaire-windows-portable.zip
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            carte-scolaire-windows-installation.exe
            carte-scolaire-windows-portable.zip

  release:
    name: Publier la version
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Créer la version (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          TAG="v${VERSION}-${{ github.run_number }}"
          gh release create "$TAG" out/carte-scolaire.apk out/carte-scolaire-windows-installation.exe out/carte-scolaire-windows-portable.zip \
            --title "Carte Scolaire ${VERSION} (build ${{ github.run_number }})" \
            --notes "Compilé automatiquement à partir du commit ${GITHUB_SHA::7}.

          - **carte-scolaire.apk** : Android, à ouvrir sur le téléphone pour l'installer.
          - **carte-scolaire-windows-installation.exe** : installateur Windows 10/11 (64 bits).
          - **carte-scolaire-windows-portable.zip** : version Windows sans installation, à décompresser puis lancer carte_scolaire.exe." \
            --latest
