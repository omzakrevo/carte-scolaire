name: APK Android

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler et publier l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Compilation de l'APK
        run: flutter build apk --release

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk carte-scolaire.apk

      - name: Conserver l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: carte-scolaire-apk
          path: carte-scolaire.apk

      - name: Publier une version (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          TAG="v${VERSION}-${{ github.run_number }}"
          gh release create "$TAG" carte-scolaire.apk \
            --title "Carte Scolaire ${VERSION} (build ${{ github.run_number }})" \
            --notes "APK Android compilé automatiquement à partir du commit ${GITHUB_SHA::7}. Téléchargez **carte-scolaire.apk** ci-dessous et ouvrez-le sur le téléphone pour l'installer." \
            --latest
